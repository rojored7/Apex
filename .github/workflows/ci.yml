# CI de APEX (US-003, US-004, US-008). Jobs: api, web, images, scripts, secrets-scan y,
# desde S2-W0-1 (US-068), e2e-stack. Los nombres de los jobs son los checks obligatorios
# de la protección de main; no se renombran, solo se agregan.
# Revisión de Fase 4 del Sprint 2 (L3): toda acción va fijada por el SHA de su commit, con la
# versión en el comentario, y todo job tiene `timeout-minutes`. Para subir una acción:
# `git ls-remote https://github.com/<dueño>/<acción> refs/tags/<versión>` y cambiar SHA y
# comentario juntos.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # postgres:16 fijado por digest (L3; reconfirmado el 2026-10-22, S3-D62, el mismo de
        # infra/compose.yml); se renueva con docs/RUNBOOK.md §7:
        # `docker buildx imagetools inspect postgres:16 --format '{{json .Manifest.Digest}}'`.
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex-ci
          POSTGRES_DB: apex_test
        options: >-
          --health-cmd "pg_isready -U apex"
          --health-interval 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      # Contraseña de CI sin valor fuera de este workflow; nunca un secreto real.
      TEST_DATABASE_URL: postgresql+asyncpg://apex:apex-ci@localhost:5432/apex_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: dependencias
        working-directory: api
        run: uv sync --frozen
      - name: age (S4B-D103)
        # Versión de ubuntu-24.04 (noble-updates) consultada el 2026-10-29 en Launchpad. Las pruebas de
        # age real (S4B-D89) corren aquí; B3a.4 agrega el paso que falla si alguna se salta.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age=1.1.1-1ubuntu0.24.04.3
          age --version
      - name: contenedor de la base de prueba (S4B-D101)
        # tests/migrations/test_db_grants.py y test_db_apply.py ejecutan roles.sql y grants.sql REALES con
        # `docker exec <contenedor> psql` (psql 16 de la propia imagen de la base); en el runner el
        # contenedor del servicio postgres no se llama apex-db_test-1, así que se busca por su puerto.
        run: |
          nombre="$(docker ps --filter publish=5432 --format "{{.Names}}" | head -1)"
          [ -n "$nombre" ] || { echo "::error::no se encontró el contenedor del servicio postgres"; exit 1; }
          docker exec "$nombre" psql --version
          echo "APEX_DB_TEST_CONTAINER=$nombre" >> "$GITHUB_ENV"
      - name: lint
        working-directory: api
        run: uv run ruff check .
      - name: formato
        working-directory: api
        run: uv run ruff format --check .
      - name: tipos
        working-directory: api
        run: uv run mypy src
      - name: fronteras entre módulos (tests/architecture)
        working-directory: api
        run: uv run pytest tests/architecture -q
      - name: openapi al día (docs/openapi.json)
        run: |
          (cd api && uv run python -m app.cli export-openapi ../docs/openapi.json)
          if ! git diff --exit-code docs/openapi.json; then
            echo "::error::docs/openapi.json está desactualizado. Corra: cd api && uv run python -m app.cli export-openapi ../docs/openapi.json"
            exit 1
          fi
      - name: pruebas con PostgreSQL 16 y cobertura
        working-directory: api
        # Política `perf` (M4, S2-D27): las pruebas con reloj quedan fuera del gate y corren
        # en el paso siguiente, que informa sin bloquear.
        run: uv run pytest -m "not perf" -rs --junitxml="$RUNNER_TEMP/junit.xml" --cov=app --cov-report=xml --cov-report=term --cov-fail-under=80
      - name: las pruebas de age real no se saltan (S4B-D103)
        # test_archive_real_age.py y test_kek_real_age.py llevan skipif (sin age o sin pty). En la CI
        # age está instalado y hay pty: si alguna se salta, la prueba de la KEK no se ejecutó y el
        # paso falla. Exige además que cada archivo haya aportado al menos una prueba.
        run: |
          uv run --directory api python - "$RUNNER_TEMP/junit.xml" << 'PYEOF'
          import sys
          import xml.etree.ElementTree as ET
          ARCHIVOS = ("test_archive_real_age", "test_kek_real_age")
          casos = ET.parse(sys.argv[1]).getroot().iter("testcase")
          cuentas = {a: [0, 0] for a in ARCHIVOS}
          for caso in casos:
              for archivo in ARCHIVOS:
                  if archivo in caso.get("classname", ""):
                      cuentas[archivo][0] += 1
                      cuentas[archivo][1] += caso.find("skipped") is not None
          for archivo, (total, saltadas) in cuentas.items():
              print(f"{archivo}: {total} pruebas, {saltadas} saltadas")
              if total == 0 or saltadas:
                  sys.exit(f"::error::{archivo} no corrió completo en la CI (S4B-D103)")
          PYEOF
      - name: pruebas de rendimiento (perf, informativas)
        working-directory: api
        continue-on-error: true
        timeout-minutes: 10
        run: uv run pytest -m perf -q
      - name: resumen de cobertura
        if: always()
        working-directory: api
        run: |
          if [ -f coverage.xml ]; then
            rate="$(grep -o 'line-rate="[0-9.]*"' coverage.xml | head -1 | cut -d'"' -f2)"
            echo "### Cobertura del api: $(awk "BEGIN { printf \"%.1f\", ${rate:-0} * 100 }") %" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-api
          path: api/coverage.xml
          if-no-files-found: ignore
      - name: auditoría de dependencias del api (pip-audit, N-5)
        working-directory: api
        # Dependencias de runtime fijadas en uv.lock, con hashes; sin el proyecto propio.
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/requirements-audit.txt"
          uvx pip-audit@2.10.1 --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements-audit.txt"
      - name: licencias-api
        run: |
          bash scripts/ci/check-licenses-api.sh
          bash scripts/ci/test_licenses.sh
      - name: NOTICE al día
        run: |
          bash scripts/ci/notice.sh
          git diff --exit-code NOTICE

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detectar front
        id: front
        run: |
          if [ -f web/package.json ]; then echo "existe=true" >> "$GITHUB_OUTPUT"; else echo "existe=false" >> "$GITHUB_OUTPUT"; echo "sin web/package.json: el job web no hace nada todavía"; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.front.outputs.existe == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: dependencias
        if: steps.front.outputs.existe == 'true'
        working-directory: web
        run: npm ci
      - name: lint
        if: steps.front.outputs.existe == 'true'
        working-directory: web
        run: npm run lint
      - name: tipos
        if: steps.front.outputs.existe == 'true'
        working-directory: web
        run: npx tsc --noEmit
      - name: tipos del api al día (src/core/api/types.ts, M3)
        if: steps.front.outputs.existe == 'true'
        working-directory: web
        run: |
          npm run gen:api
          if ! git diff --exit-code src/core/api/types.ts; then
            echo "::error::web/src/core/api/types.ts no coincide con docs/openapi.json. Corra: cd web && npm run gen:api"
            exit 1
          fi
      - name: pruebas con cobertura (M2)
        if: steps.front.outputs.existe == 'true'
        working-directory: web
        run: npm test -- --run --coverage
      - name: auditoría de dependencias de producción (npm audit, N-5)
        if: steps.front.outputs.existe == 'true'
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: auditoría de dependencias de desarrollo (informativo, S3-D63)
        if: steps.front.outputs.existe == 'true'
        continue-on-error: true
        working-directory: web
        run: npm audit --audit-level=high
      - name: build
        if: steps.front.outputs.existe == 'true'
        working-directory: web
        run: npm run build
      - name: sin Google Fonts en el build
        if: steps.front.outputs.existe == 'true'
        run: |
          if grep -rq "fonts.googleapis\|fonts.gstatic" web/dist; then
            echo "el build del front pide fuentes a Google; deben ser locales (US-009)"; exit 1
          fi
      - name: licencias-web
        if: steps.front.outputs.existe == 'true'
        working-directory: web
        run: npm run licenses --if-present
      - name: playwright de humo
        if: steps.front.outputs.existe == 'true'
        working-directory: web
        run: |
          if npm run e2e --if-present --silent -- --help > /dev/null 2>&1 || grep -q '"e2e"' package.json; then
            npx playwright install --with-deps chromium
            npm run e2e
          else
            echo "sin script e2e todavía (US-009)"
          fi

  images:
    name: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [api]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: detectar Dockerfiles
        id: img
        run: |
          [ -f api/Dockerfile ] && echo "api=true" >> "$GITHUB_OUTPUT" || echo "api=false" >> "$GITHUB_OUTPUT"
          [ -f web/Dockerfile ] && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"
          [ -f scripts/ci/compose-smoke.sh ] && echo "smoke=true" >> "$GITHUB_OUTPUT" || echo "smoke=false" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.img.outputs.api == 'true' || steps.img.outputs.web == 'true'
      # test_compose_config.sh lee el JSON de `docker compose config` con el Python del api.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: build api
        if: steps.img.outputs.api == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: api
          file: api/Dockerfile
          push: false
          load: true
          tags: apex-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: prueba de la imagen del api
        if: steps.img.outputs.api == 'true'
        run: bash scripts/ci/test_api_image.sh apex-api:ci
      - name: secretos en la imagen del api (US-039)
        if: steps.img.outputs.api == 'true'
        run: bash scripts/ci/check-image-secrets.sh apex-api:ci
      - name: build backup (S4B-W0-1)
        if: hashFiles('infra/backup/Dockerfile') != ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: infra/backup
          file: infra/backup/Dockerfile
          push: false
          load: true
          tags: apex-backup:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: secretos en la imagen de backup y pruebas de sus scripts
        if: hashFiles('infra/backup/Dockerfile') != ''
        run: |
          bash scripts/ci/check-image-secrets.sh apex-backup:ci
          bash scripts/ci/test_infra_scripts.sh
          # S4B-D190: los pins de apk existen hoy en el indice de Alpine (el cache de buildx ocultaba un pin muerto).
          bash scripts/ci/test_backup_apk_pins.sh
      - name: build web
        if: steps.img.outputs.web == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: web/Dockerfile
          push: false
          load: true
          tags: apex-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: configuración de Nginx y de Compose (M1)
        # Antes del smoke: `nginx -t` y el contrato de infra/nginx (contenedor desechable), y
        # `docker compose config` de producción, desarrollo y E2E (copia .env.example a .env
        # si falta).
        run: |
          bash scripts/ci/test_nginx_conf.sh
          bash scripts/ci/test_compose_config.sh
      - name: smoke de Compose
        if: steps.img.outputs.smoke == 'true'
        run: |
          cp .env.example .env
          cp .env.ops.example .env.ops
          SMOKE_KEEP=1 bash scripts/ci/compose-smoke.sh
      - name: restauración de punta a punta (S4B-B3a)
        # Con el stack del smoke arriba: export-kek (pty), run.sh, restore.sh con firma e inspección
        # del tar, restore-kek en tmpfs y reveal con la KEK restaurada. Las guardas de restore.sh
        # (test_restore_guard.sh) ya corrieron en el paso de scripts de respaldo.
        if: steps.img.outputs.smoke == 'true'
        run: |
          bash infra/backup/tests/test_restore_guard.sh
          dbcid="$(docker compose --env-file .env --env-file .env.ops -f infra/compose.yml -f infra/compose.dev.yml ps -q db)"
          proyecto="$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$dbcid")"
          E2E_ALLOW_PROJECT="$proyecto" bash infra/tests/restore_e2e.sh
      - name: bajar el stack del smoke
        if: always() && steps.img.outputs.smoke == 'true'
        run: docker compose --env-file .env --env-file .env.ops -f infra/compose.yml -f infra/compose.dev.yml down -v --remove-orphans

  e2e-stack:
    # S2-W0-1 (US-068 DevOps, S2-D52): Playwright (proyecto stack) contra el stack de
    # producción de Compose construido aquí (Nginx + api + db), con capturas en 320, 768,
    # 1024 y 1440 px en claro y oscuro subidas como artefacto.
    name: e2e-stack
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [images]
    env:
      # V4 del Sprint 2 (E5): perfil E2E del borde. compose.e2e.yml monta sobre la zona de
      # limit_req de la imagen (60r/m) otra con un tope alto: todo el tráfico del runner llega
      # a Nginx desde la misma IP y la suite agota los 60r/m con ráfaga 30 en segundos.
      # S4B-W0-3 (S4B-D79): dos archivos de entorno; el stack arranca como en producción (migrate y
      # dbsetup completados antes del api, que corre como apex_api).
      DC: docker compose --env-file .env --env-file .env.ops -f infra/compose.yml -f infra/compose.e2e.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: entorno y .env.seed efímero
        run: |
          cp .env.example .env
          # Perfil E2E de los límites del api (E5): topes altos solo en este job.
          sed -i -E \
            -e 's/^(LOGIN_IP_LIMIT|LOGIN_ACCOUNT_LIMIT|LOGIN_LOCK_AFTER|REFRESH_IP_LIMIT|RESET_IP_LIMIT|FORGOT_IP_LIMIT|LOGOUT_IP_LIMIT)=.*/\1=1000/' \
            -e 's/^LOGIN_ACCOUNT_GLOBAL_LIMIT=.*/LOGIN_ACCOUNT_GLOBAL_LIMIT=10000/' \
            -e 's/^(USER_WRITE_LIMIT_PER_MIN|USER_ADMIN_WRITE_LIMIT_PER_MIN|USER_REVEAL_LIMIT_PER_MIN)=.*/\1=3000/' \
            -e 's/^(USER_MEMBERS_WRITE_LIMIT_PER_MIN|USER_SEARCH_LIMIT_PER_MIN)=.*/\1=6000/' \
            -e 's/^USER_DETAIL_LIMIT_PER_MIN=.*/USER_DETAIL_LIMIT_PER_MIN=12000/' \
            -e 's/^USER_REVEAL_LIMIT_PER_HOUR=.*/USER_REVEAL_LIMIT_PER_HOUR=20000/' \
            -e 's/^USER_REVEAL_LIMIT_PER_DAY=.*/USER_REVEAL_LIMIT_PER_DAY=60000/' \
            -e 's/^USER_READ_LIMIT_PER_MIN=.*/USER_READ_LIMIT_PER_MIN=12000/' \
            -e 's/^USER_AUDIT_VERIFY_LIMIT_PER_MIN=.*/USER_AUDIT_VERIFY_LIMIT_PER_MIN=300/' \
            -e 's/^USER_AUDIT_VERIFY_LIMIT_PER_HOUR=.*/USER_AUDIT_VERIFY_LIMIT_PER_HOUR=2000/' .env
          grep -E '^(LOGIN|REFRESH|RESET|FORGOT|LOGOUT)_[A-Z_]*(LIMIT|AFTER)=' .env
          # E15 (Fase 4 del Sprint 3, H1) y E9 (S4A-B3): las once variables USER_* con los valores
          # x100 del plan (sprint-03-plan.md, sección 7 V4; sprint-04a-plan.md, B3.8). Falla si
          # .env.example cambia y alguna no se sube.
          grep -E '^USER_[A-Z_]*_LIMIT_PER_(MIN|HOUR|DAY)=' .env
          subidas="$(grep -cE '^USER_(WRITE|ADMIN_WRITE|REVEAL)_LIMIT_PER_MIN=3000$|^USER_(MEMBERS_WRITE|SEARCH)_LIMIT_PER_MIN=6000$|^USER_DETAIL_LIMIT_PER_MIN=12000$|^USER_REVEAL_LIMIT_PER_(HOUR=20000|DAY=60000)$|^USER_READ_LIMIT_PER_MIN=12000$|^USER_AUDIT_VERIFY_LIMIT_PER_MIN=300$|^USER_AUDIT_VERIFY_LIMIT_PER_HOUR=2000$' .env)"
          [ "$subidas" = "11" ] || { echo "E15: se esperaban 11 cubetas USER_* subidas y hay $subidas" >&2; exit 1; }
          umask 077
          # .env.ops (S4B-D56): contraseña del propietario y de cada rol, de 48 caracteres (hex 24), distintas y
          # enmascaradas antes de escribirlas. DATABASE_URL del propietario lleva la misma contraseña.
          cp .env.ops.example .env.ops
          for var in POSTGRES_PASSWORD APEX_API_DB_PASSWORD APEX_WORKER_DB_PASSWORD APEX_BACKUP_DB_PASSWORD; do
            valor="$(openssl rand -hex 24)"
            echo "::add-mask::$valor"
            sed -i "s/^$var=.*/$var=$valor/" .env.ops
            if [ "$var" = "POSTGRES_PASSWORD" ]; then
              sed -i "s#^DATABASE_URL=postgresql+asyncpg://apex:cambiar-esto@#DATABASE_URL=postgresql+asyncpg://apex:$valor@#" .env.ops
            fi
          done
          [ "$(grep -c "cambiar-esto" .env.ops)" = "0" ] || { echo "::error::.env.ops conserva cambiar-esto"; exit 1; }
          clave="$(openssl rand -hex 16)"
          # La máscara va antes de cualquier uso: desde aquí el valor sale como *** en el log.
          echo "::add-mask::$clave"
          {
            echo "ADMIN_EMAIL=admin@ci.apex.local"
            echo "ADMIN_INITIAL_PASSWORD=$clave"
          } > .env.seed
          # datosDeBase() (web/tests/e2e/helpers/stack.ts) exige el admin del seed (H1, V3).
          {
            echo "E2E_ADMIN_EMAIL=admin@ci.apex.local"
            echo "E2E_ADMIN_PASSWORD=$clave"
          } >> "$GITHUB_ENV"
      - name: build y llaves
        run: |
          $DC build
          $DC up -d db
          $DC --profile tools run --rm tools init-keys
      - name: levantar el stack
        run: $DC up -d --build
      - name: esperar migrate y dbsetup completados (S4B-D11)
        run: |
          for svc in migrate dbsetup; do
            for i in $(seq 1 60); do
              id="$($DC ps -a -q "$svc" | head -1)"
              estado="$([ -n "$id" ] && docker inspect -f "{{.State.Status}} {{.State.ExitCode}}" "$id" || true)"
              [ "$estado" = "exited 0" ] && { echo "$svc completado"; break; }
              case "$estado" in "exited "[1-9]*) $DC logs --tail 60 "$svc"; exit 1 ;; esac
              [ "$i" = "60" ] && { echo "$svc no terminó (estado: $estado)"; $DC logs --tail 60 "$svc"; exit 1; }
              sleep 3
            done
          done
      - name: esperar api y web healthy
        run: |
          for svc in api web; do
            for i in $(seq 1 40); do
              estado="$(docker inspect -f '{{.State.Health.Status}}' "$($DC ps -q "$svc")" 2>/dev/null || true)"
              [ "$estado" = "healthy" ] && { echo "$svc healthy"; break; }
              [ "$i" = "40" ] && { $DC logs --tail 60 "$svc"; exit 1; }
              sleep 3
            done
          done
      - name: aislamiento del entorno por servicio (H-1, S4B-D56)
        # Prueba viva: /proc/1/environ de api, worker y backup. Solo imprime nombres de variable.
        run: bash scripts/ci/test_env_isolation.sh
      - name: roles de base de datos (S4B-D100, test_db_roles.sh)
        # Justo después de dbsetup y antes de los E2E: e2e-stack sí aplica los roles y el api corre
        # como apex_api, así que los grants se ejercitan con tráfico real. Nunca imprime contraseñas.
        run: bash scripts/ci/test_db_roles.sh
      - name: seed del primer admin
        # --no-force-change (S2-B2) solo se acepta con ENV=dev, el valor de .env.example: las
        # specs no pasan por el cambio obligatorio de contraseña.
        run: $DC --profile tools run --rm tools seed --no-force-change
      - name: dependencias del front
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: playwright contra el stack
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:80
        # E2E_ADMIN_EMAIL y E2E_ADMIN_PASSWORD llegan por $GITHUB_ENV (paso del .env.seed).
        # Sin --pass-with-no-tests: una suite vacía es un fallo, no un verde (H1).
        run: npm run e2e:stack
      - name: capturas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-stack-captures
          path: web/test-results/captures/
          if-no-files-found: warn
      - name: logs del stack
        if: failure()
        run: $DC logs --tail 200
      - name: bajar el stack
        if: always()
        run: |
          $DC down -v --remove-orphans
          rm -f .env.seed

  prod-smoke:
    # S4B-B4 (S4B-D46, D100): el stack como en producción (apex-smoke): migrate y dbsetup, api como
    # apex_api, init-keys, seed y seed --demo, respaldo manual, backup_check, /health con backup y
    # migrations en ok, test_db_roles.sh, test_env_isolation.sh, deploy_e2e.sh y restore_e2e.sh.
    # Construye las imágenes él mismo (las del job images no se comparten entre jobs).
    name: prod-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [images]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: humo de producción (apex-smoke)
        env:
          CI: "1"
        run: bash scripts/ci/prod-smoke.sh
      - name: logs del stack
        if: failure()
        run: docker compose -p apex-smoke logs --tail 200 || true
      - name: bajar el stack
        if: always()
        run: docker compose -p apex-smoke down -v --remove-orphans || true

  scripts:
    name: scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: pruebas de los scripts de gate
        run: bash scripts/workflow/tests/run.sh
      - name: imágenes base por digest (S3-D62)
        run: bash scripts/ci/test_images_pinned.sh
      - name: scripts de respaldo (S4B-W0-1)
        run: bash scripts/ci/test_infra_scripts.sh
      - name: despliegue y versión del release (S4B-B4)
        run: |
          bash scripts/ci/test_deploy_script.sh
          bash scripts/ci/test_check_release_version.sh
          bash scripts/ci/check-release-version.sh --check v0.1.0

  secrets-scan:
    # US-039: gitleaks (MIT) sobre todo el historial del PR con .gitleaks.toml.
    name: secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: sin archivos de llave ni .env versionados
        run: |
          bash scripts/ci/test_check_key_files.sh
          bash scripts/ci/check-key-files.sh
      - name: gitleaks sobre el historial
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --no-banner --redact --log-opts="--all"
