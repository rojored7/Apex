# gitleaks (MIT) · US-039. Reglas por defecto más la de llaves privadas; la lista permitida
# cubre solo los textos de prueba que citan una cabecera PEM sin ser una llave.
title = "APEX"

[extend]
useDefault = true

[[rules]]
id = "apex-private-key"
description = "Llave privada en PEM"
regex = '''-----BEGIN (RSA |EC |OPENSSH |ENCRYPTED |DSA |)PRIVATE KEY-----'''
keywords = ["PRIVATE KEY"]

# Los archivos de llave crudos (kek.bin, sign-ed25519.key) no tienen cabecera PEM y gitleaks
# no los reconoce por contenido ni por ruta: los bloquea scripts/ci/check-key-files.sh (CI y
# pre-commit).

[allowlist]
description = "Documentación del plan y del diseño, y fixtures de CI que citan el formato sin material"
paths = [
  '''docs/ddd/.*''',
  '''docs/design/.*''',
  '''docs/BRECHAS\.md''',
  '''docs/PLAN\.md''',
  '''\.gitleaks\.toml''',
  '''scripts/ci/check-image-secrets\.sh''',
  '''scripts/ci/test_api_image\.sh''',
]
regexes = [
  '''cambiar-esto''',
  '''apex-test''',
  '''apex-ci''',
  '''export-no-secret''',
  # Sprint 2: contraseñas y tokens ficticios de las pruebas (api/tests, web/src/**/*.test.tsx,
  # web/tests/e2e). Se permiten por valor exacto, no por ruta, para que un secreto real en una
  # prueba siga saltando.
  '''Clave-segura-2026''',
  '''Clave-nueva-segura-2026''',
  '''Zanahoria-Lunar-42x''',
  '''Qm9uaXRvLXRva2VuLWRlLXVuLXNvbG8tdXNvXzEyMzQ1Ng''',
  # Sprint 4A: key_id ficticios de los blobs de prueba (encryptedBlob.test.ts, audit.spec.ts,
  # test_filters.py); la regla genérica los toma por una clave API. Por valor exacto.
  '''5f0c2a7e-1b3d-4c5e-8f9a-0b1c2d3e4f5a''',
  '''328c1948-e343-48a1-9ef4-1b9dab140c4f''',
]
# Sprint 4A (V9.7): tres commits intermedios, nunca publicados con secretos reales, que citan la
# cabecera PEM como texto: dbc352e (literal de prueba de init-keys, partido en 8339138) y las dos
# notas del cuaderno que lo describen (8339138 y fa0787d; el texto se reescribió en HEAD).
commits = [
  "dbc352eb657a2c90610e472f590bd0d0255ccbf1",
  "83391385f885d8b44807a04bf2e1bf4d4213241c",
  "fa0787df28de3bcf5b5cdb706a0323e61d28903a",
]
