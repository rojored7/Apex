# Configuración de Alembic (S0-W0-4, CRITICA-2 N-2). La URL de la base no vive aquí:
# migrations/env.py la toma de Settings (US-012). Una migración por cambio de tabla;
# nunca create_all en producción; nunca editar una migración aplicada (CLAUDE.md).
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
timezone = UTC
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
