[project]
name = "apex-api"
version = "0.1.0"
description = "APEX: API de administración de un gimnasio de CrossFit (socios, planes, membresías, pagos)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pre-commit>=3.8",
    "pip-licenses>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "TID", "ASYNC", "RUF"]

# CLAUDE.md, bus de criptografía, regla 8: fuera de core/crypto y core/security
# está prohibido importar estos módulos. Si el lint lo permite, alguien lo hará.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"cryptography".msg = "Prohibido fuera de core/crypto y core/security: usa core.crypto.bus o core.security"
"oqs".msg = "Prohibido fuera de core/crypto y core/security: usa core.crypto.bus o core.security"
"hashlib".msg = "Prohibido fuera de core/crypto y core/security: usa core.crypto.bus.digest"
"hmac".msg = "Prohibido fuera de core/crypto y core/security: usa core.crypto.bus.blind_index"
"jwt".msg = "Prohibido fuera de core/crypto y core/security: usa core.security"
"argon2".msg = "Prohibido fuera de core/crypto y core/security: usa core.security"

[tool.ruff.lint.per-file-ignores]
"src/app/core/crypto/**" = ["TID251"]
"src/app/core/security.py" = ["TID251"]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: requiere el PostgreSQL 16 de prueba (TEST_DATABASE_URL); falla, no se salta, si no está",
]

[tool.coverage.run]
source = ["app"]
branch = true
# M-6 (US-008): hasta el Sprint 3 el CLI y el worker quedan fuera de la cobertura
# global; el Sprint 4A (US-113) quita estas dos líneas.
omit = ["*/app/cli.py", "*/app/worker/*"]
