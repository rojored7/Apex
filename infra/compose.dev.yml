# Capa de desarrollo (US-005). Se apila sobre compose.yml desde la raíz:
#   docker compose --env-file .env -f infra/compose.yml -f infra/compose.dev.yml up -d --build
# Recarga en caliente del api, puertos publicados en el host (parametrizados porque
# otros proyectos pueden ocupar 80, 8000, 5432 o 5433) y db_test efímera para pytest.
# S4B-W0-3 (S4B-D11, E9): en desarrollo api, worker, tools y backup usan la credencial del
# PROPIETARIO (${POSTGRES_USER}) y el api migra al arrancar (MIGRATE_ON_STARTUP=true); migrate y
# dbsetup solo existen con `--profile prod-init` y ningún servicio depende de ellos
# (`depends_on: !override`). Los roles se aplican a mano: docs/RUNBOOK.md §12.
# S5-W0-4 (S5-D143): `db` hereda de compose.yml el montaje de initdb/10-apex-owner.sh y
# APEX_OWNER_DB_PASSWORD; solo actúan con un volumen de datos vacío. Los servicios de desarrollo
# siguen con el propietario (S4B-D11): migrate y tools sobreescriben su DATABASE_URL abajo.
# Un volumen NUEVO exige APEX_OWNER_DB_PASSWORD en el entorno (el script de initdb falla cerrado si
# falta o es cambiar-esto); en un volumen viejo el rol no existe y migrate (perfil prod-init) dice
# "role apex_owner does not exist" (RUNBOOK 12: reown.sql o MIGRATE_DB_USER=<propietario>).
services:
  migrate:
    profiles: ["prod-init"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

  dbsetup:
    profiles: ["prod-init"]

  api:
    build:
      # Solo en desarrollo: el build usa la red del host. En Docker Desktop con WSL2
      # el bridge puede quedar sin salida a internet y pip no alcanza PyPI.
      network: host
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    environment:
      # Los eventos de archivos no cruzan de NTFS a WSL2; se usa polling.
      WATCHFILES_FORCE_POLLING: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MIGRATE_ON_STARTUP: "true"
    depends_on: !override
      db:
        condition: service_healthy
    volumes:
      - ../api/src:/app/src
      - ../api/migrations:/app/migrations
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  worker:
    # Solo desarrollo (S4A-D9): el worker ve el código del repo en solo lectura; la imagen de
    # producción no cambia. No hay --reload: un cambio en app/worker/ o en un service que use
    # un job exige `restart worker` (RUNBOOK §7).
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MIGRATE_ON_STARTUP: "true"
    depends_on: !override
      db:
        condition: service_healthy
    volumes:
      - ../api/src:/app/src:ro
      - ../api/migrations:/app/migrations:ro

  tools:
    # Solo desarrollo (S4A-D9): mismo código que el api, en solo lectura; la imagen no cambia.
    # Con el propietario (S4B-D11, S5-D143): los volúmenes de desarrollo ya inicializados no tienen apex_owner.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ../api/src:/app/src:ro
      - ../api/migrations:/app/migrations:ro

  web:
    build:
      network: host

  backup:
    # E9 (S4B-W0-3): sin dbsetup en desarrollo no existe apex_backup; usa al propietario.
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on: !override
      db:
        condition: service_healthy

  db:
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  db_test:
    # postgres:16 por digest (2026-10-22, S3-D62; el mismo que db en compose.yml);
    # renovar (docs/RUNBOOK.md §7): docker buildx imagetools inspect postgres:16 --format '{{json .Manifest.Digest}}'
    image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex-test
      POSTGRES_DB: apex_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_TEST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex_test"]
      interval: 5s
      timeout: 3s
      retries: 12

  openbao:
    # Solo desarrollo y solo con --profile openbao (S5-D12, M-3): no arranca con `up -d` y api, worker
    # y tools NO dependen de él (CRYPTO_PROVIDER=local). Inicialización 1/1 y desello automático
    # con dev-entrypoint.sh; la llave de desarrollo vive en el volumen openbao-dev-data, nunca en el log.
    #   docker compose --env-file .env -f infra/compose.yml -f infra/compose.dev.yml --profile openbao up -d openbao
    profiles: ["openbao"]
    entrypoint: ["/bin/sh", "/dev-entrypoint.sh"]
    command: !reset []
    environment:
      APEX_ENV: dev
    volumes: !override
      - openbao-dev-data:/openbao/file
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
      - ./openbao/dev-entrypoint.sh:/dev-entrypoint.sh:ro
      - ./openbao/bootstrap.sh:/bootstrap.sh:ro
      - ./openbao/policies:/policies:ro

  mailpit:
    # Solo desarrollo y solo con --profile avisos (S5-D78): buzón SMTP de prueba, sin reinicio
    # automático. api, worker y tools NO dependen de él. SMTP 1025 solo dentro de la red; la
    # interfaz web se publica solo en el bucle local (127.0.0.1:8125).
    #   docker compose --env-file .env -f infra/compose.yml -f infra/compose.dev.yml --profile avisos up -d mailpit telegram-fake
    # axllent/mailpit v1.27.10 por digest (2026-11-05, S5-B4);
    # renovar (docs/RUNBOOK.md §7): docker buildx imagetools inspect axllent/mailpit:v1.27.10 --format '{{json .Manifest.Digest}}'
    image: axllent/mailpit:v1.27.10@sha256:b1f1be18af530d939a11ee8820b379e0c88eeec204d904bfad68862adced3a5a
    profiles: ["avisos"]
    ports:
      - "127.0.0.1:8125:8025"

  telegram-fake:
    # Solo desarrollo y solo con --profile avisos (S5-D78): imprime el JSON de cada sendMessage
    # (nunca el token) en su log. Sin puertos en el host; el api lo alcanza por la red como
    # TELEGRAM_API_BASE=http://telegram-fake:8081 (solo con ENV=dev).
    # python:3.12-alpine por digest (2026-11-05, S5-B4);
    # renovar (docs/RUNBOOK.md §7): docker buildx imagetools inspect python:3.12-alpine --format '{{json .Manifest.Digest}}'
    image: python:3.12-alpine@sha256:e6dae589c1c05976188fd3bd019afd091445fc533ed2ea29001beddc7368a9c8
    profiles: ["avisos"]
    command: ["python", "-I", "/telegram_fake.py", "--port", "8081"]
    volumes:
      - ../scripts/dev/telegram_fake.py:/telegram_fake.py:ro

volumes:
  openbao-dev-data:
