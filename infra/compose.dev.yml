# Capa de desarrollo (US-005). Se apila sobre compose.yml desde la raíz:
#   docker compose --env-file .env -f infra/compose.yml -f infra/compose.dev.yml up -d --build
# Recarga en caliente del api, puertos publicados en el host (parametrizados porque
# otros proyectos pueden ocupar 80, 8000, 5432 o 5433) y db_test efímera para pytest.
services:
  api:
    build:
      # Solo en desarrollo: el build usa la red del host. En Docker Desktop con WSL2
      # el bridge puede quedar sin salida a internet y pip no alcanza PyPI.
      network: host
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    environment:
      # Los eventos de archivos no cruzan de NTFS a WSL2; se usa polling.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../api/src:/app/src
      - ../api/migrations:/app/migrations
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  web:
    build:
      network: host

  db:
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  db_test:
    # postgres:16 por digest (2026-10-22, S3-D62; el mismo que db en compose.yml);
    # renovar (docs/RUNBOOK.md §7): docker buildx imagetools inspect postgres:16 --format '{{json .Manifest.Digest}}'
    image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex-test
      POSTGRES_DB: apex_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_TEST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex_test"]
      interval: 5s
      timeout: 3s
      retries: 12
