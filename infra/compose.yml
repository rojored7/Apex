# Stack de producción de APEX (US-005, US-006). Se invoca desde la raíz del repo con los DOS
# archivos de entorno (S4B-D56, S4B-D79):
#   docker compose --env-file .env --env-file .env.ops -f infra/compose.yml up -d --build
# `--env-file` es obligatorio: Compose interpola ${WEB_PORT:-80} desde la carpeta de este archivo,
# no desde la raíz (CRITICA-2 N-4). `.env` (lo que lee Settings, sin contraseñas) llega a api,
# worker y tools por env_file; `.env.ops` (propietario, contraseñas de rol, respaldo, red) solo se
# usa para interpolar el bloque `environment` MÍNIMO de cada servicio: ningún servicio web recibe
# el archivo entero. db no publica puerto en producción.
# Cadena de arranque (S4B-D11): db -> migrate (propietario, alembic upgrade head) -> dbsetup
# (roles y grants) -> api -> worker y web; backup arranca tras dbsetup.
# S2-W0-1: red por defecto con subred fija y `web` (Nginx) con IP fija, para que TRUSTED_PROXIES
# confíe solo en esa IP /32 (M-1); ADMIN_* solo llega a `tools` por .env.seed (M-8), nunca a api,
# worker ni db. S4B-D13: subred, rango e IP de web salen de .env.ops (APEX_SUBNET, APEX_IP_RANGE,
# APEX_WEB_IP) para poder ensayar en la misma máquina con otra subred. Los `env_file` (.env y
# .env.seed) salen de ${APEX_ENV_DIR:-..} (relativo a esta carpeta): el ensayo apunta a
# `../docs/scratch/ensayo` en su .env.ops y así api y worker NO leen el .env de desarrollo.
name: apex

services:
  db:
    # postgres:16 por digest (2026-10-22, S3-D62; el mismo en compose.dev.yml y ci.yml);
    # renovar (docs/RUNBOOK.md §7): docker buildx imagetools inspect postgres:16 --format '{{json .Manifest.Digest}}'
    image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    # Sin env_file (S4B-D56): las tres POSTGRES_* del superusuario de arranque y, solo para el script
    # de initdb, la contraseña de apex_owner (S5-D89). POSTGRES_USER solo llega a db y dbsetup.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APEX_OWNER_DB_PASSWORD: ${APEX_OWNER_DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crea apex_owner (NOSUPERUSER) y le da la base; solo corre con el volumen vacío (S5-D89). En un
      # servidor existente no se ejecuta: ver docs/RUNBOOK.md §12 (REASSIGN OWNED, paso humano).
      - ./db/initdb/10-apex-owner.sh:/docker-entrypoint-initdb.d/10-apex-owner.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    # Migraciones con `apex_owner` NOSUPERUSER (S5-D89; MIGRATE_DB_USER lo cambia en un servidor
    # existente) como unidad aparte (S4B-D8, S4B-D56): el api de producción no migra
    # (MIGRATE_ON_STARTUP=false) y nunca recibe la credencial del propietario. Sin env_file:
    # alembic lee DATABASE_URL del entorno (migrations/env.py). Sin bind de código: usa lo que la
    # imagen trae, por eso hay que reconstruirla tras cambiar src/ o migrations/ (S4B-D98).
    image: apex-api:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${MIGRATE_DB_USER:-apex_owner}:${MIGRATE_DB_PASSWORD:-${APEX_OWNER_DB_PASSWORD}}@db:5432/${POSTGRES_DB}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  dbsetup:
    # Roles y grants (S4B-D9, S4B-D72, S4B-D99): apply.sh valida las tres contraseñas y aplica
    # infra/db/roles.sql y grants.sql con el propietario. Misma imagen que db (trae psql 16).
    # Sobre una base existente: `... --profile prod-init run --rm --no-deps dbsetup` (sin
    # --no-deps, depends_on arrancaría migrate; docs/RUNBOOK.md §12).
    # postgres:16 por digest (2026-10-22, S3-D62; el mismo que db); renovar (docs/RUNBOOK.md §7):
    # docker buildx imagetools inspect postgres:16 --format '{{json .Manifest.Digest}}'
    image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    entrypoint: ["/bin/sh", "/opt/db/apply.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      APEX_API_DB_PASSWORD: ${APEX_API_DB_PASSWORD}
      APEX_WORKER_DB_PASSWORD: ${APEX_WORKER_DB_PASSWORD}
      APEX_BACKUP_DB_PASSWORD: ${APEX_BACKUP_DB_PASSWORD}
    volumes:
      - ./db:/opt/db:ro
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: apex-api:local
    env_file: ${APEX_ENV_DIR:-..}/.env
    environment:
      # Su propio rol (S4B-D56): el api no conoce la contraseña del propietario ni la de otros roles.
      DATABASE_URL: postgresql+asyncpg://apex_api:${APEX_API_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      MIGRATE_ON_STARTUP: "false"
      APP_VERSION: ${GIT_SHA:-dev}
      # S5-D44: secretos de los canales (de .env.ops) solo en api y worker; en blanco = apagado.
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # S5-D107: ruta del token de OpenBao (volumen openbao-token-api); inerte con CRYPTO_PROVIDER=local.
      OPENBAO_TOKEN_FILE: /run/apex/openbao/token
    volumes:
      - keys:/run/apex/keys:ro
      - uploads:/data/uploads
      # Token propio de OpenBao (S5-D11): archivo 600 de uid 10001 que escribe openbao-bootstrap.
      # Inerte con CRYPTO_PROVIDER=local; compose.openbao.yml quita keys y fija OPENBAO_TOKEN_FILE.
      - openbao-token-api:/run/apex/openbao:ro
    # Solo escribe en uploads (S4B-D75).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    # default (db, web) y custody (openbao): la única red desde la que se alcanza OpenBao (S5-D10).
    networks:
      - default
      - custody
    depends_on:
      db:
        condition: service_healthy
      dbsetup:
        condition: service_completed_successfully
      openbao:
        condition: service_healthy
    healthcheck:
      # La imagen slim no trae curl. Tolerante al sellado (S5-D15): 200, o 503 cuyo cuerpo trae
      # db == "ok" y migrations == "ok" (el api sellado sigue vivo y no debe reiniciarse en bucle).
      test:
        - CMD
        - python
        - -c
        - |
          import json, sys, urllib.error, urllib.request
          try:
              sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3).status == 200 else 1)
          except urllib.error.HTTPError as e:
              try:
                  d = json.load(e)
              except Exception:
                  sys.exit(1)
              sys.exit(0 if e.code == 503 and d.get("db") == "ok" and d.get("migrations") == "ok" else 1)
          except Exception:
              sys.exit(1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  worker:
    # Jobs diarios (US-113), a las 07:00 de Bogotá. Endurecido (S4A-D49, M-5): sin uploads, raíz de
    # solo lectura con /tmp en memoria, sin capacidades y sin escalada de privilegios. Su propio rol
    # de base (apex_worker) y, de solo lectura, el volumen de respaldos (S4B-D10, S4B-D11). Desde
    # S5-B3 (S5-D20, S5-D197) descifra los avisos: con CRYPTO_PROVIDER=local monta keys:ro;
    # compose.openbao.yml lo quita y le da su token de OpenBao (S5-D193).
    image: apex-api:local
    command: ["python", "-m", "app.worker.main"]
    env_file: ${APEX_ENV_DIR:-..}/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://apex_worker:${APEX_WORKER_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      BACKUP_DIR: /data/backups
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      OPENBAO_TOKEN_FILE: /run/apex/openbao/token
      # S5-B13 (S5-D72, S5-D170): llave pública de minisign (no es secreta) para verificar la firma del manifiesto.
      BACKUP_SIGN_PUBKEY: ${BACKUP_SIGN_PUBKEY:-}
    volumes:
      - backups:/data/backups:ro
      - keys:/run/apex/keys:ro
      # Token propio de OpenBao (S5-D11): solo descifra y renueva. Inerte con CRYPTO_PROVIDER=local.
      - openbao-token-worker:/run/apex/openbao:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - custody
    depends_on:
      db:
        condition: service_healthy
      api:
        # Producción: migrate y dbsetup ya corrieron cuando el api está healthy.
        condition: service_healthy
      openbao:
        condition: service_healthy
    healthcheck:
      # Latido (S4A-D8, S4A-D56): el worker toca /tmp/apex-worker-heartbeat cada 30 s solo si
      # la base responde a SELECT 1; más de 120 s sin latido = unhealthy (el aviso hasta que
      # /health lea worker.job_runs en v0.2).
      test: ["CMD", "python", "-c", "import os, sys, time; p = '/tmp/apex-worker-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # Sin perfil desde S4A-W0-2 (CRITICA-2 N-3): `up -d` lo arranca con el resto del stack,
    # siempre después de db y api healthy. Corridas a mano y estado: `run --rm worker python
    # -m app.worker.main --run-once <job>` / `--status <job>` (docs/RUNBOOK.md §9, "Worker").
    restart: unless-stopped

  tools:
    # Comandos del CLI: docker compose run --rm tools init-keys | seed | rotate-key ...
    # Superficie de operador (S4B-D56, S4B-D86): usa la credencial de `apex_owner` (S5-D89; TOOLS_DB_USER
    # la cambia en un servidor existente) por environment,
    # única vía con escritura sobre el volumen keys, lee los respaldos en solo lectura y es el único
    # servicio que lee .env.seed (ADMIN_EMAIL y ADMIN_INITIAL_PASSWORD; se borra tras el primer
    # seed). Opcional: init-keys y los demás comandos no lo necesitan (Compose >= 2.24).
    image: apex-api:local
    entrypoint: ["python", "-m", "app.cli"]
    env_file:
      - ${APEX_ENV_DIR:-..}/.env
      - path: ${APEX_ENV_DIR:-..}/.env.seed
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${TOOLS_DB_USER:-apex_owner}:${TOOLS_DB_PASSWORD:-${APEX_OWNER_DB_PASSWORD}}@db:5432/${POSTGRES_DB}
      OPENBAO_TOKEN_FILE: /run/apex/openbao/token
      BACKUP_SIGN_PUBKEY: ${BACKUP_SIGN_PUBKEY:-}
    volumes:
      - keys:/run/apex/keys
      - uploads:/data/uploads
      - backups:/data/backups:ro
      # Token propio de OpenBao (S5-D11): además rota la llave y recifra (apex-tools).
      - openbao-token-tools:/run/apex/openbao:ro
    # L-3 (Sprint 5): la CLI no necesita ninguna capacidad ni escalada de privilegios.
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - custody
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  backup:
    # Respaldo cifrado y firmado (S4B-W0-1, S4B-D14, D57, D75): pg_dump + uploads -> age, manifiesto
    # firmado con minisign, cron con supercronic. Sin BACKUP_AGE_RECIPIENT queda inerte pero visible
    # en el log. Sin env_file: solo este bloque (S4B-D56). Lee la base con el rol apex_backup
    # (pg_read_all_data, S4B-D7); compose.dev.yml lo cambia por el propietario porque en desarrollo
    # no corre dbsetup. La llave de firma se monta de BACKUP_SIGN_KEY_FILE (archivo 600 de uid 10001
    # en el anfitrión; sin archivo, run.sh sale con 2 y lo dice). La identidad de verificación llega
    # solo con infra/compose.verify.yml.
    build:
      context: ./backup
    image: apex-backup:local
    environment:
      PGHOST: db
      PGUSER: apex_backup
      PGPASSWORD: ${APEX_BACKUP_DB_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_AGE_VERIFY_RECIPIENT: ${BACKUP_AGE_VERIFY_RECIPIENT:-}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      RCLONE_CONFIG_APEX_TYPE: ${RCLONE_CONFIG_APEX_TYPE:-s3}
      RCLONE_CONFIG_APEX_PROVIDER: ${RCLONE_CONFIG_APEX_PROVIDER:-}
      RCLONE_CONFIG_APEX_ENDPOINT: ${RCLONE_CONFIG_APEX_ENDPOINT:-}
      RCLONE_CONFIG_APEX_ACCESS_KEY_ID: ${RCLONE_CONFIG_APEX_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_APEX_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_APEX_SECRET_ACCESS_KEY:-}
      BACKUP_SIGN_PUBKEY: ${BACKUP_SIGN_PUBKEY:-}
      TZ: America/Bogota
    volumes:
      - backups:/data/backups
      - uploads:/data/uploads:ro
      - ${BACKUP_SIGN_KEY_FILE:-/dev/null}:/run/apex/backup/sign.key:ro
      # S5-B13 (S5-D8, S5-D11): token de la politica apex-backup-snapshot (solo lee la instantanea raft);
      # volumen propio montado SOLO aqui. Sin token (volumen vacio) la instantanea se omite.
      - openbao-token-backup:/run/apex/openbao-backup:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    # default (db) y custody (openbao): backup pide la instantanea raft (S5-B13).
    networks:
      - default
      - custody
    depends_on:
      db:
        condition: service_healthy
      dbsetup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pgrep", "-x", "supercronic"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  openbao:
    # OpenBao (motor Transit) como KMS del bus de criptografía (S5-D10, D11, D104; docs/operacion/openbao.md).
    # OpenBao 2.7.2 por digest del índice multiarquitectura (2026-11-04). Verificar el digest fijado con
    # `docker buildx imagetools inspect openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f`; el digest vigente
    # de un tag nuevo se obtiene como en docs/RUNBOOK.md §7 (misma consulta con el tag, sin digest).
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    # Sin el entrypoint de la imagen (escribiría en /openbao/config y sumaría un segundo -config): el
    # servidor arranca con la configuración de UN archivo montado en solo lectura (S5-D104).
    entrypoint: ["bao"]
    command: ["server", "-config=/openbao/config/config.hcl"]
    init: true
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    # uid 100 / gid 1000: el dueño de /openbao/file en la imagen; el volumen nombrado nuevo lo hereda.
    user: "100:1000"
    volumes:
      - openbao-data:/openbao/file
      - ./openbao/config.hcl:/openbao/config/config.hcl:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    # Solo la red interna custody: sin puertos y sin salida (S5-D10). Reinicia sellado: se desella
    # a mano tres veces (docs/operacion/openbao.md); sellado cuenta como sano (sealedcode=200).
    networks:
      - custody
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8200/v1/sys/health?sealedcode=200&uninitcode=200"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  openbao-bootstrap:
    # Instalación y operación de OpenBao (S5-D76, M-1): interactivo, sin log de contenedor (las 5
    # llaves de desello solo salen por la terminal) y con una capacidad: escribir cada token con
    # el dueño de su servicio (CHOWN). Corre como root porque los volúmenes openbao-token-* nacen
    # root:root; umask 077 y chmod 600 antes del chown. Misma imagen que openbao.
    #   docker compose --env-file .env --env-file .env.ops -f infra/compose.yml \
    #     --profile bootstrap run --rm openbao-bootstrap --first-install
    # Mismo digest que el servicio openbao (2026-11-04); se renueva junto con él (imagetools inspect, RUNBOOK §7).
    image: openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      # 8210: listener local con generate-root y rekey abiertos (S5-D107); el bootstrap comparte la red
      # del contenedor openbao y no pisa la red custody.
      BAO_ADDR: http://127.0.0.1:8210
    user: "0:0"
    volumes:
      - ./openbao/bootstrap.sh:/bootstrap.sh:ro
      - ./openbao/policies:/policies:ro
      - openbao-token-api:/tokens/api
      - openbao-token-worker:/tokens/worker
      - openbao-token-tools:/tokens/tools
      - openbao-token-backup:/tokens/backup
    stdin_open: true
    tty: true
    logging:
      driver: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    security_opt:
      - no-new-privileges:true
    network_mode: "service:openbao"
    depends_on:
      openbao:
        condition: service_healthy
    profiles: ["bootstrap"]
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: apex-web:local
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      default:
        # Fuera del ip_range dinámico: ningún otro contenedor puede tomarla. TRUSTED_PROXIES de
        # .env debe ser esta IP /32 (en el ensayo, 172.31.0.10/32).
        ipv4_address: ${APEX_WEB_IP:-172.30.0.10}
    # Endurecimiento (S4B-D75): la imagen oficial arranca como root y baja a `nginx`, de ahí las
    # cuatro capacidades; escribe solo en estos tmpfs.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        # Verificada libre en este host (docker network inspect) el 2026-10-21. Para ensayar en la
        # misma máquina: APEX_SUBNET=172.31.0.0/24, APEX_IP_RANGE=172.31.0.128/25 y
        # APEX_WEB_IP=172.31.0.10 en .env.ops (y TRUSTED_PROXIES=172.31.0.10/32 en .env).
        - subnet: ${APEX_SUBNET:-172.30.0.0/24}
          ip_range: ${APEX_IP_RANGE:-172.30.0.128/25}
  custody:
    # Red de custodia (S5-D10, D77): solo openbao, openbao-bootstrap, api, worker y tools. internal:
    # sin salida a internet ni al anfitrión. web, db y backup no están aquí. Para ensayar en la misma
    # máquina: APEX_CUSTODY_SUBNET=172.31.12.0/24 (ensayo) o 172.31.13.0/24 (smoke) en .env.ops.
    internal: true
    ipam:
      config:
        - subnet: ${APEX_CUSTODY_SUBNET:-172.30.1.0/24}

volumes:
  pgdata:
  uploads:
  keys:
  backups:
  openbao-data:
  openbao-token-api:
  openbao-token-worker:
  openbao-token-tools:
  openbao-token-backup:
