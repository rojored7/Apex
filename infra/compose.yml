# Stack de producción de APEX (US-005, US-006). Se invoca desde la raíz del repo:
#   docker compose --env-file .env -f infra/compose.yml up -d --build
# `--env-file .env` es obligatorio: Compose interpola ${WEB_PORT:-80} desde la carpeta
# de este archivo, no desde la raíz (CRITICA-2 N-4). Los secretos entran solo por
# env_file; nunca se escriben aquí. db no publica puerto en producción.
# S2-W0-1: red por defecto con subred fija y `web` (Nginx) con IP fija, para que
# TRUSTED_PROXIES confíe solo en esa IP /32 (M-1); ADMIN_* solo llega a `tools` por
# .env.seed (M-8), nunca a api, worker ni db.
name: apex

services:
  db:
    # postgres:16 por digest (2026-10-22, S3-D62; el mismo en compose.dev.yml y ci.yml);
    # renovar (docs/RUNBOOK.md §7): docker buildx imagetools inspect postgres:16 --format '{{json .Manifest.Digest}}'
    image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    env_file: ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    image: apex-api:local
    env_file: ../.env
    volumes:
      - keys:/run/apex/keys:ro
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # La imagen slim no trae curl; /health existe desde US-020.
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    # Jobs diarios (US-113), a las 07:00 de Bogotá. Endurecido (S4A-D49, M-5): en 4A no
    # cifra ni descifra, así que no monta keys ni uploads (el Sprint 5 vuelve a montar
    # keys:ro), raíz de solo lectura con /tmp en memoria, sin capacidades y sin escalada de
    # privilegios. Usa la credencial del api hasta el rol de base separado (S4B-W0-2).
    image: apex-api:local
    command: ["python", "-m", "app.worker.main"]
    env_file: ../.env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      api:
        # El api aplica las migraciones al arrancar: el worker no corre antes de 0012.
        condition: service_healthy
    healthcheck:
      # Latido (S4A-D8, S4A-D56): el worker toca /tmp/apex-worker-heartbeat cada 30 s solo si
      # la base responde a SELECT 1; más de 120 s sin latido = unhealthy (el aviso hasta que
      # /health lea worker.job_runs en v0.2).
      test: ["CMD", "python", "-c", "import os, sys, time; p = '/tmp/apex-worker-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # Sin perfil desde S4A-W0-2 (CRITICA-2 N-3): `up -d` lo arranca con el resto del stack,
    # siempre después de db y api healthy. Corridas a mano y estado: `run --rm worker python
    # -m app.worker.main --run-once <job>` / `--status <job>` (docs/RUNBOOK.md §9, "Worker").
    restart: unless-stopped

  tools:
    # Comandos del CLI: docker compose run --rm tools init-keys | seed | rotate-key ...
    # Única vía con escritura sobre el volumen keys y único servicio que lee .env.seed
    # (ADMIN_EMAIL y ADMIN_INITIAL_PASSWORD; se borra tras el primer seed). Opcional:
    # init-keys y los demás comandos no lo necesitan (Compose >= 2.24).
    image: apex-api:local
    entrypoint: ["python", "-m", "app.cli"]
    env_file:
      - ../.env
      - path: ../.env.seed
        required: false
    volumes:
      - keys:/run/apex/keys
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  backup:
    # Respaldo cifrado y firmado (S4B-W0-1, S4B-D14, D57, D75): pg_dump + uploads -> age, manifiesto
    # firmado con minisign, cron con supercronic. Sin BACKUP_AGE_RECIPIENT queda inerte pero visible
    # en el log. Sin env_file: solo este bloque (S4B-D56). Hasta W0-3 usa la credencial del
    # propietario; W0-3 la cambia por el rol apex_backup. La llave de firma se monta de
    # BACKUP_SIGN_KEY_FILE (archivo 600 de uid 10001 en el anfitrión; sin archivo, run.sh sale con 2
    # y lo dice). La identidad de verificación llega solo con infra/compose.verify.yml.
    build:
      context: ./backup
    image: apex-backup:local
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_AGE_VERIFY_RECIPIENT: ${BACKUP_AGE_VERIFY_RECIPIENT:-}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      RCLONE_CONFIG_APEX_TYPE: ${RCLONE_CONFIG_APEX_TYPE:-s3}
      RCLONE_CONFIG_APEX_PROVIDER: ${RCLONE_CONFIG_APEX_PROVIDER:-}
      RCLONE_CONFIG_APEX_ENDPOINT: ${RCLONE_CONFIG_APEX_ENDPOINT:-}
      RCLONE_CONFIG_APEX_ACCESS_KEY_ID: ${RCLONE_CONFIG_APEX_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_APEX_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_APEX_SECRET_ACCESS_KEY:-}
      BACKUP_SIGN_PUBKEY: ${BACKUP_SIGN_PUBKEY:-}
      TZ: America/Bogota
    volumes:
      - backups:/data/backups
      - uploads:/data/uploads:ro
      - ${BACKUP_SIGN_KEY_FILE:-/dev/null}:/run/apex/backup/sign.key:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-x", "supercronic"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    image: apex-web:local
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      default:
        # Fuera del ip_range dinámico: ningún otro contenedor puede tomarla.
        ipv4_address: 172.30.0.10
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        # Verificada libre en este host (docker network inspect) el 2026-10-21; si choca
        # con otra red, usar 172.31.0.0/24 y mover web y TRUSTED_PROXIES con ella.
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25

volumes:
  pgdata:
  uploads:
  keys:
  backups:
