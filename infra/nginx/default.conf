# Nginx de APEX (US-006, US-038): sirve el build del front y hace proxy de /api/ al api.
# Borde de la LAN en v0.1 (P7); cuando Caddy entre delante (v0.3, EP-20) se pasa a
# real_ip desde Caddy. Cabeceras de seguridad en snippets/security-headers.conf,
# incluido en cada location (un add_header en un location anula los del server).
# CSP con nonce por petición: $request_id, inyectado en index.html con sub_filter.
# El log no incluye query strings ni cabeceras con tokens.

log_format apex escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"request_id":"$request_id","upstream_time":"$upstream_response_time"}';

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 5m;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout apex;
    # Solo errores: el error_log de Nginx incluye la línea de la petición (con query).
    error_log /dev/stderr error;

    # Token de la TV (v0.5, US-175): este location existe para que su access_log nunca
    # registre la query string aunque el formato general cambie (N-44). Mismo proxy.
    location /api/v1/tv/ {
        access_log /dev/stdout apex;
        include snippets/proxy-api.conf;
    }

    location /api/ {
        include snippets/proxy-api.conf;
    }

    # El index se sirve sin caché y con el nonce de la petición (US-038): sub_filter
    # reemplaza el marcador que Vite escribe en cada <script> y <link>. sub_filter solo
    # actúa sobre respuestas sin comprimir; aquí no hay gzip_static.
    location = /index.html {
        include snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header Cache-Control "no-store" always;
        sub_filter '__CSP_NONCE__' '$request_id';
        sub_filter_once off;
        sub_filter_types text/html;
    }

    # Assets con hash en el nombre: caché larga e inmutable.
    location /assets/ {
        include snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /fonts/ {
        include snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location /brand/ {
        include snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta cae en index.html (redirección interna al location de arriba).
    location / {
        include snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
