# Nginx de APEX (US-006): sirve el build del front y hace proxy de /api/ al api.
# Borde de la LAN en v0.1 (P7); cuando Caddy entre delante (v0.3, EP-20) se pasa a
# real_ip desde Caddy. Cabeceras de seguridad y CSP con nonce: US-038.
# El log no incluye query strings ni cabeceras con tokens.

log_format apex escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"request_id":"$request_id","upstream_time":"$upstream_response_time"}';

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 5m;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout apex;
    error_log /dev/stderr warn;

    # API: conserva la ruta completa (/api/v1/...). El 413 sale aquí, antes de abrir
    # la conexión al api (proxy_request_buffering on por defecto).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    # El index nunca se cachea (nonce de la CSP por petición, US-038).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Assets con hash en el nombre: caché larga e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /brand/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta cae en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
