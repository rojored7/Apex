# Nginx de APEX (US-006, US-038): sirve el build del front y hace proxy de /api/ al api.
# Borde de la LAN en v0.1 (P7); cuando Caddy entre delante (v0.3, EP-20) se pasa a
# real_ip desde Caddy. Cabeceras de seguridad en snippets/security-headers.conf,
# incluido en cada location (un add_header en un location anula los del server).
# CSP con nonce por petición: $request_id, inyectado en index.html con sub_filter.
# El log no incluye query strings ni cabeceras con tokens.
# S2-W0-1: Referrer-Policy por location (no-referrer en el documento, que responde toda la
# SPA incluida /restablecer/<token>; strict-origin-when-cross-origin en assets y api) y
# limit_req en /api/v1/auth/ con el 429 en el envelope del api.

log_format apex escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"request_id":"$request_id","upstream_time":"$upstream_response_time"}';

# M-3 (Sprint 1) / E5 (Sprint 2): tope por IP del socket para todo /api/v1/auth/ (60r/m,
# burst 30 nodelay; decisión S2-W0-1). La zona vive en snippets/auth-zone.conf para que el
# perfil E2E (infra/compose.e2e.yml, V4) pueda montar otra sin tocar la imagen; el limitador
# fino por IP y por cuenta vive en el api (core/ratelimit) y es configurable por .env.
include snippets/auth-zone.conf;

server {
    listen 80;
    server_name _;
    server_tokens off;
    # 5m en el server para los adjuntos de v0.3 (tope de 5 MB, CLAUDE.md), que tendrán su
    # propio location; todo /api/ de hoy baja a 64k y /api/v1/auth/ a 16k (L-A de V10, S3-D101).
    client_max_body_size 5m;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout apex;
    # Solo críticos: desde el nivel error, Nginx escribe la línea de la petición con su query
    # (por ejemplo, "connect() failed ... request: GET /api/v1/members?q=..." si el api cae).
    # El 502 sigue en el access log (con $uri) y el api registra sus propios errores.
    error_log /dev/stderr crit;
    limit_req_status 429;
    # Los rechazos de limit_req se registran en warn (por debajo de crit): no salen al log.
    limit_req_log_level warn;

    # Token de la TV (v0.5, US-175): este location existe para que su access_log nunca
    # registre la query string aunque el formato general cambie (N-44). Mismo proxy.
    location /api/v1/tv/ {
        access_log /dev/stdout apex;
        client_max_body_size 64k;
        include snippets/proxy-api.conf;
    }

    # Login, refresh, logout, forgot y reset: tope por IP en el borde (M-3) y cuerpos JSON
    # pequeños (L-12). Más largo que /api/, gana el emparejamiento.
    location /api/v1/auth/ {
        limit_req zone=apex_auth burst=30 nodelay;
        client_max_body_size 16k;
        error_page 429 = @rate_limited;
        include snippets/proxy-api.conf;
    }

    # L-A de V10 (S3-D101): ningún cuerpo JSON legítimo de hoy pasa de 64k (motivos de 2.000
    # caracteres, MemberPatch, settings), salvo el texto de la política de privacidad, que va
    # en su propio location.
    location /api/ {
        client_max_body_size 64k;
        include snippets/proxy-api.conf;
    }

    # `PATCH /api/v1/settings/privacy`: `policy_text` admite 20.000 caracteres; en UTF-8 son
    # hasta 80.000 bytes (4 por carácter), más el resto del JSON.
    location = /api/v1/settings/privacy {
        client_max_body_size 128k;
        include snippets/proxy-api.conf;
    }

    # 429 de limit_req con el mismo envelope que el api (core/errors.py, rate_limited).
    # Las respuestas 429 del propio api pasan tal cual (proxy_intercept_errors off).
    location @rate_limited {
        include snippets/security-headers.conf;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; form-action 'none'" always;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        default_type application/json;
        return 429 '{"error":{"code":"rate_limited","message":"Demasiados intentos. Espera un momento."}}';
    }

    # El index se sirve sin caché y con el nonce de la petición (US-038): sub_filter
    # reemplaza el marcador que Vite escribe en cada <script> y <link>. sub_filter solo
    # actúa sobre respuestas sin comprimir; aquí no hay gzip_static.
    # Responde toda ruta del SPA tras try_files, incluida /restablecer/<token> (M-3): por eso
    # el no-referrer va aquí y no en un location de /restablecer/, que nunca respondería.
    location = /index.html {
        include snippets/security-headers.conf;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-store" always;
        sub_filter '__CSP_NONCE__' '$request_id';
        sub_filter_once off;
        sub_filter_types text/html;
    }

    # Assets con hash en el nombre: caché larga e inmutable.
    location /assets/ {
        include snippets/security-headers.conf;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /fonts/ {
        include snippets/security-headers.conf;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location /brand/ {
        include snippets/security-headers.conf;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta cae en index.html (redirección interna al location de arriba).
    location / {
        include snippets/security-headers.conf;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
