# Perfil E2E del borde (V4 del Sprint 2, E5). NO entra en la imagen web: solo lo monta
# infra/compose.e2e.yml sobre /etc/nginx/snippets/auth-zone.conf mientras corren las specs
# del proyecto stack de Playwright. Todas las peticiones del host llegan a Nginx con la misma
# IP (la puerta de enlace de la red de Compose), y cada carga completa de la SPA hace
# POST /auth/refresh y GET /auth/me: la suite agota los 60r/m con ráfaga 30 de producción
# en unos segundos. Mismo nombre y tamaño de zona; solo sube la tasa.
limit_req_zone $binary_remote_addr zone=apex_auth:10m rate=6000r/m;
