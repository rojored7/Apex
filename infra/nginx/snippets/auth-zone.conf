# Zona del limit_req de /api/v1/auth/ (M-3 del Sprint 1, E5 del Sprint 2): 60 por minuto por
# IP del socket; el location aplica burst=30 nodelay. Se incluye en el contexto http desde
# default.conf. Es el valor de producción que lleva la imagen web. Solo el perfil E2E
# (infra/compose.e2e.yml, validación V4) monta encima infra/nginx/e2e/auth-zone.conf.
limit_req_zone $binary_remote_addr zone=apex_auth:10m rate=60r/m;
