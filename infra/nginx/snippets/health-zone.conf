# Zona del limit_req de /api/v1/health (M-2 del Sprint 4A revisado en S4B-D60): 30 por minuto por IP
# del socket; el location aplica burst=10 nodelay y el 429 sale en el envelope del api. /health es
# público y cada petición consulta la base; el healthcheck interno de Compose va directo al api
# (127.0.0.1:8000/health) y no pasa por Nginx ni por esta zona. Se incluye en el contexto http desde
# default.conf; vive aparte de auth-zone.conf porque el perfil E2E (infra/compose.e2e.yml) monta otra
# auth-zone.conf encima y esta zona debe conservarse igual.
limit_req_zone $binary_remote_addr zone=apex_health:1m rate=30r/m;
