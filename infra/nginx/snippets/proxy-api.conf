# Proxy al api (US-006). Conserva la ruta completa (/api/v1/...). El 413 sale en Nginx,
# antes de abrir la conexión al api (proxy_request_buffering on por defecto).
proxy_pass http://api:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
proxy_read_timeout 60s;
# Las respuestas del api nunca se interpretan como documento ni se incrustan (US-038).
include snippets/security-headers.conf;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
