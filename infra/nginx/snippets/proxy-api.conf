# Proxy al api (US-006). Conserva la ruta completa (/api/v1/...). El 413 sale en Nginx,
# antes de abrir la conexión al api (proxy_request_buffering on por defecto).
proxy_pass http://api:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
proxy_read_timeout 60s;
# Las respuestas del api nunca se interpretan como documento ni se incrustan (US-038).
include snippets/security-headers.conf;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; form-action 'none'" always;
# L-1 (Sprint 1): ninguna respuesta del api se guarda en caché del navegador ni de un proxy.
# M3 de Fase 4 del Sprint 3: el api ya manda las dos (core/http.py y el 503 `busy`) y
# `add_header` agrega, no reemplaza: se ocultan las del upstream y Nginx pone una de cada una
# (también en sus propios 413, 429 y 502, que no pasan por el api).
proxy_hide_header Cache-Control;
proxy_hide_header Pragma;
add_header Cache-Control "no-store" always;
add_header Pragma "no-cache" always;
