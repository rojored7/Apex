# Todo lo que depende de la IP de Caddy (S6-D64, D82, D97, M-7). Se incluye en el contexto http, antes
# del server. Plantilla versionada: el marcador de abajo es la IP fija de Caddy (APEX_CADDY_IP).
# real-ip.conf es esta plantilla renderizada con la IP por omisión de .env.ops.example; si APEX_CADDY_IP
# cambia, infra/deploy.sh renderiza otra copia FUERA del árbol y Compose la monta encima
# (APEX_REAL_IP_CONF). Solo se confía en X-Forwarded-For si el par TCP es Caddy, y solo en su último
# salto (real_ip_recursive off): Caddy escribe su propio X-Forwarded-For.
set_real_ip_from 172.30.0.11/32;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

# Protocolo del cliente: https solo si el par TCP REAL ($realip_remote_addr, antes de real_ip) es Caddy
# y su X-Forwarded-Proto es exactamente https; en cualquier otro caso http.
map $http_x_forwarded_proto $apex_xfp {
    default http;
    https   https;
}
map $realip_remote_addr $apex_proto {
    default            http;
    172.30.0.11  $apex_xfp;
}
