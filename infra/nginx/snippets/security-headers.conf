# Cabeceras de seguridad comunes (US-038, T5). Se incluye en CADA location, porque un
# add_header dentro de un location anula los del bloque server. `always` las agrega
# también a las respuestas de error. HSTS llega con TLS (US-153).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
