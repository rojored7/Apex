# Zona del limit_req de /api/v1/tv/ (L-2 de la revisión de S8-C2): 120 por minuto por IP del socket;
# el location aplica burst=60 nodelay. Holgado a propósito: una TV válida pide cada 15 s y varias
# pantallas pueden salir por la misma IP del box; el tope solo corta sondeos de tokens, que de otro
# modo llegan a la base (cada petición inválida hace un SELECT de la sección `tv`, aun la que acaba en
# 429). El límite fino por token y por IP vive en el api (`tv` y `tv-fail`). Se incluye en el contexto
# http desde default.conf.
limit_req_zone $binary_remote_addr zone=apex_tv:1m rate=120r/m;
