# Zona del limit_req de la subida de adjuntos (S6-D59, decisión 4 del orquestador): 30 por minuto
# por IP del socket; el location de la subida aplica burst=10 nodelay. Se incluye en el contexto
# http desde default.conf. Es el valor de producción; el perfil E2E monta encima otra más alta.
limit_req_zone $binary_remote_addr zone=apex_upload:1m rate=30r/m;
# Concurrencia (revisión de seguridad de S6-W0-2): la subida es anónima para Nginx y recibe
# hasta 6m en el tmpfs de 64m antes de que el api autentique; limit_req acota la tasa, no las
# conexiones abiertas. Dos cuerpos en vuelo por IP; el location añade client_body_timeout 15s.
limit_conn_zone $binary_remote_addr zone=apex_upload_conn:1m;
